x-app: &app
  build: .
  env_file: .env
  environment:
    MYSQL_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: health
      MYSQL_USER: health
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - health-mysql:/var/lib/mysql
      - ./db/test-grant.sql:/docker-entrypoint-initdb.d/test-grant.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h127.0.0.1 -uhealth health -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    <<: *app
    command: gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --threads 8
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: celery -A config worker -l INFO --concurrency 2
  beat:
    <<: *app
    command: celery -A config beat -l INFO

volumes:
  health-mysql:
